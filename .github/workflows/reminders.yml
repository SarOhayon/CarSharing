# Vercel can't run code in the background, so this pings the site every
# 10 minutes to send any reminder emails that are due. It does nothing until
# the APP_URL and CRON_SECRET repository secrets are set (not needed on Render
# or your own computer, which send reminders by themselves).
name: Send reminder emails

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reminders"
